name: Build and Deploy to GitHub Pages

on:
  push:
      branches:
            - modifiche  # 👈 Sostituisci con "master" se il tuo branch principale si chiama così

            jobs:
              deploy:
                  runs-on: ubuntu-latest

                      steps:
                            # 1. Scarica il codice dal repository
                                  - name: Checkout Code
                                          uses: actions/checkout@v4

                                                # 2. Installa Node.js nel server di GitHub
                                                      - name: Setup Node.js
                                                              uses: actions/setup-node@v4
                                                                      with:
                                                                                node-version: 20 # 👈 Usa la versione di Node che preferisci
                                                                                          cache: 'npm'

                                                                                                # 3. Installa le dipendenze del tuo progetto
                                                                                                      - name: Install Dependencies
                                                                                                              run: npm ci

                                                                                                                    # 4. Compila il progetto Angular (Build)
                                                                                                                          - name: Build Angular Project
                                                                                                                                  run: ./node_modules/.bin/ng build --configuration production --base-href "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

                                                                                                                                        # 5. Prende i file compilati e li spara sul branch gh-pages
                                                                                                                                              - name: Deploy to GitHub Pages
                                                                                                                                                      uses: JamesIves/github-pages-deploy-action@v4
                                                                                                                                                              with:
                                                                                                                                                                        folder: dist/alpizzificio # 👈 CONTROLLA: deve essere la cartella creata dalla build
                                                                                                                                                                                  branch: gh-pages
                                                                                                                                                                                  ,
